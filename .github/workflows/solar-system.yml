name: solar system workflows

on:
    workflow_dispatch: 
    push: 
        branches: 
            - main
            - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        # services:
        #   mongodb:
        #     image: siddharth67/mongodb-db:non-prod
        #     ports:
        #       - 27017:27017
        # env:
        #     MONGO_URI: 'mongodb://localhost:27017/superData'
        #     MONGO_USERNAME: non-prod-user
        #     MONGO_PASSWORD: non-prod-password
        strategy:
          matrix:
            nodejs_version: [18, 20]
            operating_system: [ubuntu-latest]
            exclude:
                - nodejs_version: 18
                  operating_system: macos-latest

        runs-on: ${{ matrix.operating_system }}
        steps:
            - name: Checkout Respository
              uses: actions/checkout@v4

            - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
              uses: actions/setup-node@v4
              with:
                node-version: ${{ matrix.nodejs_version }}

            - name: Cache the NPM dependencies
              uses: actions/cache@v4
              with: 
                path: node_modules
                key: ${{ runner.os}}-node-modules-${{ hashFiles('package-lock.json')}}

            - name: Install Dependencies
              run: npm install

            - name: Unit Testing
              id: nodejs-unit-test
              run: npm test

            - name: Generate Timestamp
              id: timestamp
              run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

            - name: Archive Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: Mocha-Test_results-${{ github.job }}-${{ steps.timestamp.outputs.timestamp }}
                path: test-results.xml

    code-coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        # container: 
        #     image: node:18
        # services:
        #   mongodb:
        #     image: siddharth67/mongodb-db:non-prod
        #     # ports:
        #     #   - 27017:27017 
        #     options: 
        #         --name mongo
        # env:
        #     MONGO_URI: 'mongodb://mongo:27017/superData'
        #     MONGO_USERNAME: non-prod-user
        #     MONGO_PASSWORD: non-prod-password
        steps:
        - name: Checkout Repositories
          uses: actions/checkout@v4

        # - name: Setup NodeJS Version - 18
        #   uses: actions/setup-node@v4
        #   with:
        #     node_version: 18

        - name: Cache the NPM dependencies
          uses: actions/cache@v4
          with: 
            path: node_modules
            key: ${{ runner.os}}-node-modules-${{ hashFiles('package-lock.json')}}

        - name: Install Dependencies
          run: npm install

        - name: Check code coverage
          continue-on-error: true
          run: npm run coverage


        - name: Archive test result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5
        
    docker:
        name: Contenerization
        needs: [unit-testing, code-coverage]
        permissions: 
            packages: write
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Dockerhub Login
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD}}

        # - name: ghcr Login
        #   uses: docker/login-action@v3
        #   with:
        #     username: ${{ github.repository_owner }}
        #     password: ${{ secrets.GITHUB_TOKEN }}

        - name: Docker Build for testing
          uses: docker/build-push-action@v4
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha}}

        - name: Docker Image test
          run: |
            docker images
            docker run --name solar-system-app -d \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha}}

            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo Testing Image URL using wget
            wget -q -O - 127.0.0.1:3000/live | grep live

        - name: Container Registry Push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: |
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha}}
            #  ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

    dev-deploy:
      needs: docker
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Install Kubectl CLI
          uses: azure/setup-kubectl@v3

        - name: Fetch kubernetes Cluster Details
          run: |
            kubectl version --client
            echo ------------------
            kubectl get nodes
            
        - name: Save Nginx Ingress Controller IP as a GITHUB Environment Variable
          run: |
              echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controlr -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV


        - name: Replace Token in Manifest files
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Create Mongodb Secret
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
            --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
            --from-literal=MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
            --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
            --save-config \
            --dry-run=client \
            -o yaml | kunectl apply -f -

        - name: Deploy to Dev Env
          run: |
              kubectl apply -f kubernetes/development



    intergration-testing:
          name: Dev Integration Testing
          needs: dev-deploy
          runs-on: ubuntu-latest
          steps:
            - name: Test URL Output using CURL and JQ
              run: |
                echo $URL
                echo "____________________________"
                curl https://$URL/live -s -k | jq -r .status | grep -i live